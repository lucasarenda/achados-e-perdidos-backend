version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lost-and-found-db
    environment:
      POSTGRES_DB: lost_and_found
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lost-and-found-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lost_and_found
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-super-secret-key-before-deploying-to-production-0123456789
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads: