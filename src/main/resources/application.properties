# Server configuration
server.port=${SERVER_PORT:8080}

# Spring Application configuration
spring.application.name=lost-and-found-backend
logging.level.org.springframework.security=DEBUG

# Datasource configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lost_and_found}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate configuration
# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Security (JWT) configuration
security.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploying-to-production-0123456789}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Custom Geocoding configuration
geocoding.api.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org/search}
geocoding.api.user-agent=${GEOCODING_USER_AGENT:achados-e-perdidos-backend/1.0 (seu-email@exemplo.com)}

# Custom Storage configuration
storage.upload-dir=${UPLOAD_DIR:./uploads}
storage.public-base-url=${PUBLIC_BASE_URL:/uploads}

# SpringDoc OpenAPI / Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html